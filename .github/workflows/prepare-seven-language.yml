name: Prepare Seven language contribution

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/add-seven-language'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-seven-language
          fetch-depth: 0

      - name: Stop when generation is already complete
        id: state
        shell: bash
        run: |
          if test -e vendor/grammars/Seven; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.state.outputs.complete != 'true'
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Generate and validate Seven language support
        if: steps.state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          script/add-grammar https://github.com/gabriell211/Seven

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/linguist/languages.yml")
          text = path.read_text(encoding="utf-8")
          marker = "ShaderLab:\n"
          entry = """Seven:
  type: programming
  color: "#7B2CBF"
  extensions:
  - ".sev"
  interpreters:
  - seven
  tm_scope: source.seven
  ace_mode: text
"""
          if "\nSeven:\n" not in text:
              if marker not in text:
                  raise SystemExit("Could not find alphabetical insertion point")
              text = text.replace(marker, entry + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

          script/update-ids

          mkdir -p samples/Seven
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/gabriell211/Seven/main/compiler/lexer.sev \
            --output samples/Seven/compiler_lexer.sev
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/gabriell211/Seven/main/compiler/driver.sev \
            --output samples/Seven/compiler_driver.sev
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/gabriell211/Seven/main/runtime/installer/seven.sev \
            --output samples/Seven/installer_runtime.sev

          bundle exec rake samples
          bundle exec rake test
          bundle exec bin/github-linguist samples/Seven --breakdown

          rm -f .github/workflows/prepare-seven-language.yml
          git add -A
          git commit -m "Add Seven programming language"
          git push origin HEAD:agent/add-seven-language
